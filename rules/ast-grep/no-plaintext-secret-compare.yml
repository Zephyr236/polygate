# Credential checks must be constant time.
id: no-plaintext-secret-compare
language: python
severity: error
message: >-
  Compare credentials with secrets.compare_digest, never with equality operators.
files:
  - backend/src/polygate/api/**/*.py
rule:
  any:
    - pattern: $A == $B
    - pattern: $A != $B
constraints:
  A:
    regex: '(?i)^(token|secret|key|credential|cred|provided|expected|auth|password|api_key)$'
