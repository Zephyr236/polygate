# Decision rules for agent-proposed gates.
#
# Every candidate declares a gap type and an artifact type. This file decides:
# which artifact kinds may address which gap types, where the artifact may live,
# which metadata fields are mandatory, and whether the candidate can be verified
# automatically or needs a human decision.

version = 1
max_candidates = 20

[gap_types.static_pattern]
description = "A syntax, import or call pattern that a linter can match."
artifacts = ["semgrep_rule", "ast_grep_rule"]

[gap_types.business_invariant]
description = "A state, ordering, idempotency or accounting rule that only a test can assert."
artifacts = ["property_test", "stateful_test", "e2e_test"]

[gap_types.module_boundary]
description = "A dependency, ownership or interface rule between modules."
artifacts = ["architecture_rule", "architecture_test"]

[gap_types.doc_contract]
description = "A documented example, field or endpoint that must match the code."
artifacts = ["doc_assertion"]

[gap_types.deployment_policy]
description = "A deployment default such as port binding, authentication or secret handling."
artifacts = ["deploy_check", "policy_proposal"]

[gap_types.internal_design]
description = "A design choice with no mechanical oracle, such as splitting a module."
artifacts = ["adr_proposal"]

[gap_types.unknown]
description = "Evidence exists but no deterministic artifact can express it yet."
artifacts = ["gap_report"]

# --- Artifact contracts -----------------------------------------------------

[artifacts.semgrep_rule]
acceptance = "auto"
oracle = "rule"
paths = ["rules/candidates/"]
requires = ["rule_file", "positive_fixture", "negative_fixture", "incident_ref"]

[artifacts.ast_grep_rule]
acceptance = "auto"
oracle = "rule"
paths = ["rules/candidates/"]
requires = ["rule_file", "positive_fixture", "negative_fixture", "incident_ref"]

[artifacts.property_test]
acceptance = "auto"
oracle = "pre_post"
paths = ["backend/tests/agent/"]
requires = ["test_file", "invariant", "pre_fix_commit", "post_fix_commit", "incident_ref"]

[artifacts.stateful_test]
acceptance = "auto"
oracle = "pre_post"
paths = ["backend/tests/agent/"]
requires = ["test_file", "invariant", "pre_fix_commit", "post_fix_commit", "incident_ref"]

[artifacts.e2e_test]
acceptance = "auto"
oracle = "pre_post"
paths = ["backend/tests/agent/"]
requires = ["test_file", "invariant", "pre_fix_commit", "post_fix_commit", "incident_ref"]

[artifacts.architecture_rule]
acceptance = "auto"
oracle = "fixture_command"
paths = ["rules/candidates/", "backend/tests/agent/"]
requires = ["artifact_file", "invariant", "command", "positive_fixture", "negative_fixture", "incident_ref"]

[artifacts.architecture_test]
acceptance = "auto"
oracle = "fixture_command"
paths = ["backend/tests/agent/"]
requires = ["artifact_file", "invariant", "command", "positive_fixture", "negative_fixture", "incident_ref"]

[artifacts.doc_assertion]
acceptance = "auto"
oracle = "fixture_command"
paths = ["backend/tests/agent/", "scripts/agent_checks/"]
requires = ["artifact_file", "invariant", "command", "positive_fixture", "negative_fixture", "incident_ref"]

[artifacts.deploy_check]
acceptance = "auto"
oracle = "fixture_command"
paths = ["backend/tests/agent/", "scripts/agent_checks/"]
requires = ["artifact_file", "invariant", "command", "positive_fixture", "negative_fixture", "incident_ref"]

[artifacts.policy_proposal]
acceptance = "human"
oracle = "none"
paths = ["docs/proposals/"]
requires = ["artifact_file", "decision", "options", "incident_ref"]

[artifacts.adr_proposal]
acceptance = "human"
oracle = "none"
paths = ["docs/proposals/"]
requires = ["artifact_file", "decision", "options", "evidence"]

[artifacts.gap_report]
acceptance = "human"
oracle = "none"
paths = ["docs/proposals/"]
requires = ["artifact_file", "evidence"]
