services:
  polygate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: polygate:0.1.0
    container_name: polygate
    env_file:
      - ../.env
    environment:
      POLYGATE_CONFIG: /app/config/providers.toml
      POLYGATE_DATABASE: /app/data/polygate.db
    volumes:
      - polygate-data:/app/data
      - ../deploy/providers.toml:/app/config/providers.toml:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  polygate-data:
