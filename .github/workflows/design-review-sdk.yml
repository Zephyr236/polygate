name: Design review (SDK)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: design-review-sdk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent:
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'design-review-sdk')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Claude Agent SDK
        run: python3 -m pip install 'claude-agent-sdk==0.2.188'
      - name: Fetch the pull request head as data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin \
            "pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
          HEAD_SHA=$(git rev-parse refs/remotes/origin/pr-head)
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/pr-head "$HEAD_SHA"
      - name: Write PR body as the design brief
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr view ${{ github.event.pull_request.number }} --json body --jq .body > /tmp/design-brief.md
      - name: Run the design agent
        env:
          DESIGN_REVIEW_API_KEY: ${{ secrets.ZEN_API_KEY }}
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_MODEL: deepseek-v4.1-flash
        run: |
          python3 scripts/design_agent_sdk.py \
            --repo /tmp/pr-head \
            --base ${{ github.event.pull_request.base.sha }} \
            --head "$HEAD_SHA" \
            --brief /tmp/design-brief.md \
            --out reports/design-review.md \
            --max-turns 8 \
            --budget-usd 1.0
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-review-sdk-report
          path: reports/design-review.md
          if-no-files-found: warn
      - name: Comment the report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f reports/design-review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file reports/design-review.md
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "Design review SDK agent failed; see the workflow log."
          fi
