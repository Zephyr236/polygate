name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "fix/gate-59-60"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: lint and format
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: types
        run: uv run mypy src
      - name: import boundaries
        run: uv run lint-imports
      - name: tests with coverage
        run: uv run pytest tests --cov=polygate --cov-branch --cov-report=term --cov-report=lcov:lcov.info
      - name: CRAP gate
        run: uv run crap4py src --lcov lcov.info --max-crap 6
      - name: dead code
        run: uv run vulture src --min-confidence 80
      - name: docstrings
        run: uv run interrogate -q src
      - name: cognitive complexity
        run: uv run flake8 src
      - name: security scan
        run: uv run bandit -q -c .bandit -r src
      - name: dependency audit (runtime set)
        run: |
          uv export --no-dev --format requirements-txt --no-hashes -o .runtime-reqs.txt
          uv run pip-audit -r .runtime-reqs.txt
      - name: dependency hygiene
        run: uv run deptry src
      - name: coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/lcov.info

  design-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project backend --extra dev --frozen
      - name: semgrep design rules
        run: uv run --project backend semgrep scan --config rules/architecture.yml --error --quiet backend/src frontend/src
      - name: ast-grep structural rules
        run: |
          curl -sSL -o /tmp/sg.zip https://github.com/ast-grep/ast-grep/releases/latest/download/app-x86_64-unknown-linux-gnu.zip
          unzip -o -q /tmp/sg.zip -d /tmp/sg && chmod +x /tmp/sg/ast-grep
          /tmp/sg/ast-grep scan --config sgconfig.yml
      - name: module size
        run: python scripts/size_gate.py
      - name: class cohesion
        run: python scripts/cohesion_gate.py
      - name: duplicate code
        run: uv run --project backend --with jscpd jscpd backend/src frontend/src

  backend-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run pytest tests/e2e -q -m e2e
      - run: uv run pytest tests/e2e/test_contracts.py -q -m contract

  backend-mutation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run mutmut run --max-children 4
      - run: python ../scripts/mutation_gate.py 75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation
          path: backend/mutants/mutmut-stats.json

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gherkin:lint
      - run: pnpm run bdd
      - run: pnpm run openspec:validate
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: ./node_modules/.bin/dependency-cruise src tests --config .dependency-cruiser.cjs
      - run: ./node_modules/.bin/knip --include files,exports,types,dependencies,devDependencies,unlisted
      - run: pnpm run test
      - run: pnpm run crap
      - run: python ../scripts/crap_js_gate.py crap-report/crap-report.json 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/
            frontend/crap-report/

  frontend-mutation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run mutate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-mutation
          path: frontend/reports/mutation.json

  frontend-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm exec playwright test

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --project backend --extra dev --frozen
      - run: uv run --project backend python scripts/docs_gate.py
      - run: uv run --project backend --with mkdocs --with mkdocs-material mkdocs build --strict
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline README.md AGENTS.md CONTRIBUTING.md CHANGELOG.md docs/

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t polygate:ci .
      - run: |
          docker run -d --name polygate-ci -p 8080:8080 -e ADMIN_TOKEN=ci-token polygate:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then echo healthy; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          docker rm -f polygate-ci

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Fail on high or critical CodeQL findings
        run: python3 scripts/codeql_gate.py codeql-results

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: cd backend && uv sync --extra dev --frozen
      - name: BDD scenarios
        run: cd backend && uv run pytest tests/bdd --junitxml=bdd.xml
      - name: Requirements and finding policy
        run: backend/.venv/bin/python scripts/contract_gate.py --junit backend/bdd.xml --out contract.json
      - name: ADR contract
        run: backend/.venv/bin/python scripts/adr_gate.py
      - name: Workflow capability contract
        run: backend/.venv/bin/python scripts/capability_gate.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gate state-machine model
        run: backend/.venv/bin/python scripts/tla_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-report
          path: contract.json

  architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: cd backend && uv sync --extra dev --frozen
      - name: Load the trusted architecture baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          if git show FETCH_HEAD:specs/architecture-baseline.json > /tmp/architecture-baseline.json 2>/dev/null; then
            echo "ARCH_BASELINE=/tmp/architecture-baseline.json" >> "$GITHUB_ENV"
          else
            echo "No base baseline; this change introduces the first baseline."
          fi
      - name: Architecture metrics ratchet
        run: backend/.venv/bin/python scripts/architecture_gate.py --baseline "${ARCH_BASELINE:-specs/architecture-baseline.json}"
      - name: Architecture metrics report
        run: backend/.venv/bin/python scripts/architecture_metrics.py --out architecture-metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-metrics
          path: architecture-metrics.json

  gate:
    if: always()
    needs:
      [backend, design-rules, backend-e2e, backend-mutation, frontend, frontend-mutation, frontend-e2e, docs, secrets, docker, codeql, contract, architecture]
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Record the tested pull-request head
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for target in "${{ github.event.pull_request.head.sha }}" "${{ github.sha }}"; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name=ci-head \
              -f head_sha="$target" \
              -f status=completed \
              -f conclusion=success \
              -f 'output[title]=Tested PR head' \
              -f "output[summary]=tested_head=${{ github.event.pull_request.head.sha }}"
          done
      - name: Require every gate to pass
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = [name for name, item in needs.items() if item["result"] != "success"]
          if bad:
              print("gates not successful:", bad)
              sys.exit(1)
          print("all gates passed:", ", ".join(sorted(needs)))
          PYTHON
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
