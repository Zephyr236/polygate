name: Design gate

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: design-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      skip: ${{ steps.pr.outputs.skip }}
      trusted: ${{ steps.pr.outputs.trusted }}
    steps:
      - name: Resolve the pull request and check for a stale CI run
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.workflow_run.pull_requests[0].number }}"
          RUN_HEAD="${{ github.event.workflow_run.pull_requests[0].head.sha }}"
          if [ -z "$PR" ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "$RUN_HEAD" ]; then
            RUN_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.workflow_run.head_sha }}" --jq '.parents[1].sha // empty')
          fi
          if [ -z "$PR" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/${{ github.event.workflow_run.head_sha }}" \
              -f state=failure -f context=design-review -f description="No pull request found for CI run" || true
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefOid --jq .baseRefOid)
          ASSOC=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .author_association)
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "trusted=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ -z "$RUN_HEAD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine the CI run's PR head; skipping."
            exit 0
          fi
          if [ "$RUN_HEAD" != "$HEAD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CI run reviewed $RUN_HEAD, current head is $HEAD; skipping."
            exit 0
          fi
          GATE=""
          for _ in $(seq 1 45); do
            GATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json statusCheckRollup \
              --jq '[.statusCheckRollup[] | select(.name == "gate") | .conclusion] | last // ""')
            case "$GATE" in
              SUCCESS) break ;;
              FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Current head gate is $GATE; not spending a model call."
                exit 0
                ;;
            esac
            sleep 20
          done
          HEAD_AFTER=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$HEAD_AFTER" != "$HEAD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "PR head moved from $HEAD to $HEAD_AFTER while waiting; the new CI run will review it."
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if [ "$GATE" != "SUCCESS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Current head gate is $GATE after waiting; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Mark the design review pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/${{ needs.resolve.outputs.head }}" \
            -f state=pending \
            -f context=design-review \
            -f description="Design review running"

  design_gate:
    needs: [resolve, prepare]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Claude Agent SDK
        run: python3 -m pip install 'claude-agent-sdk==0.2.188'
      - name: Fetch the pull request head as data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin \
            "pull/${{ needs.resolve.outputs.number }}/head:refs/remotes/origin/pr-head"
          HEAD_SHA=$(git rev-parse refs/remotes/origin/pr-head)
          if [ "$HEAD_SHA" != "${{ needs.resolve.outputs.head }}" ]; then
            echo "PR head moved to $HEAD_SHA before review; waiting for the new CI run."
            exit 1
          fi
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/pr-head "$HEAD_SHA"
      - name: Write PR body as the design brief
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr view ${{ needs.resolve.outputs.number }} --json body --jq .body > /tmp/design-brief.md
      - name: Run the design gate
        env:
          DESIGN_REVIEW_API_KEY: ${{ secrets.ZEN_API_KEY }}
          ANTHROPIC_BASE_URL: https://opencode.ai/zen/go
          ANTHROPIC_MODEL: deepseek-v4.1-flash
        run: |
          python3 scripts/design_gate.py \
            --repo /tmp/pr-head \
            --base ${{ needs.resolve.outputs.base }} \
            --head "$HEAD_SHA" \
            --sha "$HEAD_SHA" \
            --brief /tmp/design-brief.md \
            --pr ${{ needs.resolve.outputs.number }} \
            --no-publish \
            ${{ needs.resolve.outputs.trusted == 'true' && '--allow-bash' || '' }} \
            --budget-usd 4.0 \
            --out reports/design-gate.json
      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gate-report
          path: reports/design-gate.json
          if-no-files-found: warn
  publish:
    needs: [resolve, design_gate]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.base }}
      - name: Download the gate report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: design-gate-report
          path: reports
      - name: Publish the verdict and blocking issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/design_publish.py \
            --repo-slug "$GITHUB_REPOSITORY" \
            --pr ${{ needs.resolve.outputs.number }} \
            --sha ${{ needs.resolve.outputs.head }} \
            --gate-result "${{ needs.design_gate.result }}" \
            --started-at "${{ github.run_started_at }}" \
            --report reports/design-gate.json
