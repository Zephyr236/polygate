name: agent-accept

on:
  issues:
    types: [labeled]
  workflow_run:
    workflows: ["Gate candidate"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-accept-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  accept:
    if: github.event_name != 'issues' || github.event.label.name == 'agent-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve candidate issue
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            echo "event=$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label agent-candidate --state open --limit 100 \
            --json number,labels --jq '[.[] | select(([.labels[].name] | index("agent-promoted") | not) and ([.labels[].name] | index("agent-rejected") | not) and ([.labels[].name] | index("agent-needs-human") | not))] | sort_by(.number) | last | .number // empty')
          if [ -z "$number" ]; then
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "no unprocessed agent-candidate issue"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json number,body,author > /tmp/agent-issue.json
          python3 scripts/agent_gate/issue.py --issue-json /tmp/agent-issue.json --event-out /tmp/agent-event.json
          echo "event=/tmp/agent-event.json" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install backend dependencies
        if: steps.resolve.outputs.number != ''
        run: uv sync --project backend --extra dev --frozen

      - name: Extract candidate
        if: steps.resolve.outputs.number != ''
        run: python3 scripts/agent_gate/issue.py --event "${{ steps.resolve.outputs.event }}" --out-dir /tmp/agent-candidate

      - name: Apply candidate patch
        if: steps.resolve.outputs.number != ''
        run: git apply --whitespace=nowarn /tmp/agent-candidate/candidate.patch

      - name: Run acceptance
        if: steps.resolve.outputs.number != ''
        id: accept
        run: |
          set +e
          uv run --project backend python scripts/accept_candidate.py \
            --candidate /tmp/agent-candidate/candidate.json \
            --repo . --json --soak 3 > /tmp/agent-report.json
          echo "code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Promote accepted candidate
        id: promote
        continue-on-error: true
        if: steps.resolve.outputs.number != '' && steps.accept.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PROMOTE_TOKEN }}
          AGENT_PROMOTE_TOKEN: ${{ secrets.AGENT_PROMOTE_TOKEN }}
        run: |
          if [ -z "$AGENT_PROMOTE_TOKEN" ]; then
            echo "token_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_url="https://github.com/$GITHUB_REPOSITORY/issues/${{ steps.resolve.outputs.number }}"
          id=$(python3 -c "import json;print(json.load(open('/tmp/agent-candidate/candidate.json'))['id'])")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          if python3 -c "import json,sys; data=json.load(open('agent/accepted.json')); sys.exit(0 if any(item.get('id')==sys.argv[1] for item in data) else 1)" "$id"; then
            gh issue edit "${{ steps.resolve.outputs.number }}" --repo "$GITHUB_REPOSITORY" --add-label agent-promoted
            echo "already=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          uv run --project backend python scripts/promote_candidate.py \
            --candidate /tmp/agent-candidate/candidate.json \
            --report /tmp/agent-report.json \
            --repo . --issue "$issue_url"
          {
            echo "Automated promotion of agent candidate \`$id\`."
            echo ""
            echo "Acceptance report:"
            echo '```json'
            cat /tmp/agent-report.json
            echo '```'
          } > /tmp/promote-body.md
          git config user.name "polygate-agent"
          git config user.email "polygate-agent@users.noreply.github.com"
          git checkout -b "agent/$id"
          git add -A
          git commit -m "feat: promote agent candidate $id"
          git push "https://x-access-token:${AGENT_PROMOTE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:agent/$id"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "agent/$id" \
            --title "[agent-accepted] $id" --body-file /tmp/promote-body.md 2>/dev/null \
            || gh pr list --repo "$GITHUB_REPOSITORY" --head "agent/$id" --json url --jq '.[0].url')
          echo "pr=$pr_url" >> "$GITHUB_OUTPUT"
          pr_number="${pr_url##*/}"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash || true
          gh issue edit "${{ steps.resolve.outputs.number }}" --repo "$GITHUB_REPOSITORY" --add-label agent-promoted

      - name: Compose comment
        if: steps.resolve.outputs.number != ''
        run: |
          code="${{ steps.accept.outputs.code }}"
          case "$code" in
            0) verdict="passed"; label="agent-accepted" ;;
            2) verdict="needs a human decision"; label="agent-needs-human" ;;
            *) verdict="failed"; label="agent-rejected" ;;
          esac
          {
            echo "## Agent candidate: $verdict"
            echo ""
            echo '```json'
            cat /tmp/agent-report.json 2>/dev/null || echo "{\"verdict\":\"error\"}"
            echo '```'
            if [ "${{ steps.promote.outputs.token_missing }}" = "true" ]; then
              echo ""
              echo "> Promotion token is not configured; the candidate is accepted but not promoted."
            fi
            if [ "${{ steps.promote.outcome }}" = "failure" ]; then
              echo ""
              echo "> Promotion failed; the candidate stays accepted but was not merged. See the workflow log."
            fi
            if [ "${{ steps.promote.outputs.already }}" = "true" ]; then
              echo ""
              echo "> Already promoted; no new PR was created."
            fi
            if [ -n "${{ steps.promote.outputs.pr }}" ]; then
              echo ""
              echo "> Promotion PR: ${{ steps.promote.outputs.pr }}"
            fi
          } > /tmp/agent-comment.md
          echo "label=$label" >> "$GITHUB_OUTPUT"
        id: comment

      - name: Comment on failure
        if: failure() && steps.resolve.outputs.number != '' 
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.resolve.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "agent-accept failed before a verdict; see the workflow run for details."

      - name: Ensure labels and comment
        if: steps.resolve.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create agent-candidate --color 0E8A16 --description "Agent-proposed gate candidate" --force
          gh label create agent-accepted --color 1D76DB --description "Candidate passed acceptance" --force
          gh label create agent-rejected --color B60205 --description "Candidate failed acceptance" --force
          gh label create agent-needs-human --color D93F0B --description "Candidate needs a human decision" --force
          gh label create agent-promoted --color 5319E7 --description "Candidate is promoted and merged" --force
          gh issue comment "${{ steps.resolve.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/agent-comment.md
          gh issue edit "${{ steps.resolve.outputs.number }}" --repo "$GITHUB_REPOSITORY" --add-label "${{ steps.comment.outputs.label }}"
